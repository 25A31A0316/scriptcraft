name: Deploy ScriptCraft to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build All Workspaces
        run: |
          npm run build --workspace=@screenplay/schema
          npm run build --workspace=@screenplay/engine
          npm run build --workspace=@screenplay/formatting
          npm run build --workspace=@screenplay/import-export
          npm run build --workspace=@screenplay/web

      - name: Deploy to gh-pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: apps/web/dist
          branch: gh-pages
